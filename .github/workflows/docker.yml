name: Build and Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-shared:
    name: test-shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install runtime test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y libcjson-dev

      - name: Test Dial native touch UI
        run: |
          git clone --quiet --depth 1 --branch v9.5.0 https://github.com/lvgl/lvgl.git /tmp/dial-test-lvgl
          test "$(git -C /tmp/dial-test-lvgl rev-parse HEAD)" = 85aa60d18b3d5e5588d7b247abf90198f07c8a63
          cmake -S tests/dial_native -B /tmp/dial-native-build -DLVGL_SOURCE=/tmp/dial-test-lvgl -DDIAL_SANITIZE=ON
          cmake --build /tmp/dial-native-build -j2
          /tmp/dial-native-build/dial_native_checks

      - name: Test shared configuration contracts
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -Icommon tests/test_controller_connection.c common/controller_connection.c -o /tmp/test-controller-connection
          /tmp/test-controller-connection
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Icommon -I/usr/include/cjson tests/test_controller_library.c common/controller_library.c -lcjson -o /tmp/test-controller-library
          /tmp/test-controller-library
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Icommon -I/usr/include/cjson tests/test_home_assistant_lights.c common/home_assistant_lights.c -lcjson -o /tmp/test-home-assistant-lights
          /tmp/test-home-assistant-lights
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Icommon tests/test_controller_navigation.c common/controller_navigation.c -o /tmp/test-controller-navigation
          /tmp/test-controller-navigation
          scripts/test_connection_runtime.sh
          bash scripts/test_bridge_cache.sh
          python3 scripts/check_bridge_recovery_contract.py
          python3 tests/test_firmware_stack_audit.py
          python3 tests/test_release_firmware.py
          bash scripts/test_ota_update.sh
          sh tests/run_portal_trace.sh
          python3 tests/test_dial_wake_dispatch.py
          python3 tests/test_firmware_artifact_cache.py
          python3 tests/test_connection_web_status.py
          scripts/test_zone_label_policy.sh
          python3 scripts/check_platform_power_and_wifi.py
          python3 scripts/check_dial_identity.py
          python3 scripts/check_dial_power_copy.py
          python3 scripts/check_controller_dependencies.py
          python3 scripts/check_controller_dependencies.py --self-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic -pthread \
            -DCONTROLLER_CONFIG_TEST \
            -Icommon -Iinclude \
            tests/test_controller_config.c \
            common/controller_config.c \
            -o /tmp/test-controller-config
          /tmp/test-controller-config
          cc -std=c11 -Wall -Wextra -Werror -pedantic -pthread \
            -DCONTROLLER_CONFIG_TEST -DTEST_COMPILED_DEFAULTS \
            '-DCONFIG_RK_DEFAULT_SSID="compiled-ssid"' \
            '-DCONFIG_RK_DEFAULT_PASS="compiled-pass"' \
            -Icommon -Iinclude \
            tests/test_controller_config.c \
            common/controller_config.c \
            -o /tmp/test-controller-config-defaults
          /tmp/test-controller-config-defaults
          cc -std=c11 -Wall -Wextra -Werror -pedantic -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DCONTROLLER_CONFIG_TEST \
            -Icommon -Iinclude \
            tests/test_controller_config.c \
            common/controller_config.c \
            -o /tmp/test-controller-config-sanitized
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test-controller-config-sanitized
          cc -std=c11 -Wall -Wextra -Werror -pedantic -pthread \
            -DTEST_DIAL_ADAPTER \
            -Icommon -Iinclude -Iidf_app/main \
            tests/test_platform_provisioning_adapter.c \
            idf_app/main/platform_provisioning_dial.c \
            idf_app/main/http_server_lifecycle.c \
            -o /tmp/test-provisioning-adapter-dial
          /tmp/test-provisioning-adapter-dial
          sh tests/run_wifi_provisioning_lifecycle.sh
          cc -std=c11 -Wall -Wextra -Werror -pedantic -pthread \
            -Icommon -Iinclude \
            tests/test_controller_input.c \
            common/controller_input.c \
            common/platform/platform_task.c \
            -o /tmp/test-controller-input
          /tmp/test-controller-input
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Icommon \
            tests/test_controller_input_mailbox.c \
            common/controller_input_mailbox.c \
            -o /tmp/test-controller-input-mailbox
          /tmp/test-controller-input-mailbox
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -DTEST_DIAL_PROFILE \
            -Icommon \
            tests/test_controller_input_profile.c \
            idf_app/main/controller_input_profile_dial.c \
            -o /tmp/test-controller-input-profile-dial
          /tmp/test-controller-input-profile-dial
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -DTEST_DIAL_PROFILE \
            -Icommon -Iinclude \
            tests/test_controller_input_profile_resolution.c \
            common/controller_input.c \
            idf_app/main/controller_input_profile_dial.c \
            -o /tmp/test-controller-input-profile-resolution-dial
          /tmp/test-controller-input-profile-resolution-dial
          cc -std=c11 -Wall -Wextra -Werror \
            -Icommon -Iinclude \
            tests/test_controller_presentation_dial.c \
            idf_app/main/controller_presentation_dial.c \
            -o /tmp/test-controller-presentation-dial
          /tmp/test-controller-presentation-dial
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Icommon \
            tests/test_controller_values.c \
            common/controller_view.c \
            common/controller_view_compat.c \
            -o /tmp/test-controller-values
          /tmp/test-controller-values
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Icommon -Iinclude \
            tests/test_controller_action_router.c \
            common/controller_action_router.c \
            common/controller_input.c \
            -o /tmp/test-controller-action-router
          /tmp/test-controller-action-router
          cc -std=c11 -Wall -Wextra -Werror -pedantic -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Icommon -Iinclude \
            tests/test_controller_input.c \
            common/controller_input.c \
            common/platform/platform_task.c \
            -o /tmp/test-controller-input-sanitized
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test-controller-input-sanitized
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Icommon \
            tests/test_controller_input_mailbox.c \
            common/controller_input_mailbox.c \
            -o /tmp/test-controller-input-mailbox-sanitized
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test-controller-input-mailbox-sanitized
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DTEST_DIAL_PROFILE \
            -Icommon \
            tests/test_controller_input_profile.c \
            idf_app/main/controller_input_profile_dial.c \
            -o /tmp/test-controller-input-profile-dial-sanitized
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test-controller-input-profile-dial-sanitized
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DTEST_DIAL_PROFILE \
            -Icommon -Iinclude \
            tests/test_controller_input_profile_resolution.c \
            common/controller_input.c \
            idf_app/main/controller_input_profile_dial.c \
            -o /tmp/test-controller-input-profile-resolution-dial-sanitized
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test-controller-input-profile-resolution-dial-sanitized
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Icommon -Iinclude \
            tests/test_controller_action_router.c \
            common/controller_action_router.c \
            common/controller_input.c \
            -o /tmp/test-controller-action-router-sanitized
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/test-controller-action-router-sanitized
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Icommon \
            tests/test_bridge_command_plan.c \
            common/bridge_command_plan.c \
            -o /tmp/test-bridge-command-plan
          /tmp/test-bridge-command-plan
          cc -std=c11 -Wall -Wextra -Werror \
            -Icommon tests/test_rk_cfg.c -o /tmp/test-rk-cfg
          /tmp/test-rk-cfg
          cc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/rk_ble_hid_host/include \
            tests/test_rk_ble_hid_usage.c \
            components/rk_ble_hid_host/rk_ble_hid_report.c \
            -o /tmp/test-rk-ble-hid-usage
          /tmp/test-rk-ble-hid-usage
          cc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/rk_ble_hid_host/include \
            -Icomponents/rk_ble_hid_host \
            tests/test_rk_ble_hid_policy.c \
            components/rk_ble_hid_host/rk_ble_hid_policy.c \
            -o /tmp/test-rk-ble-hid-policy
          /tmp/test-rk-ble-hid-policy
          cc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/rk_ble_hid_host/include \
            tests/test_rk_ble_hid_stub.c \
            components/rk_ble_hid_host/rk_ble_hid_host_stub.c \
            -o /tmp/test-rk-ble-hid-stub
          /tmp/test-rk-ble-hid-stub

  build-idf:
    name: build-idf
    needs: test-shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fingerprint firmware inputs
        id: firmware-key
        run: python3 scripts/firmware_artifact_cache.py key --target dial --directory firmware-cache/dial

      - name: Restore exact firmware artifact
        id: firmware-cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: firmware-cache/dial
          key: firmware-v1-dial-${{ steps.firmware-key.outputs.fingerprint }}

      - name: Verify reusable firmware
        id: reuse
        if: steps.firmware-cache.outputs.cache-hit == 'true'
        run: |
          if python3 scripts/firmware_artifact_cache.py verify --target dial --directory firmware-cache/dial; then
            echo 'reused=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Get version from tag or CMakeLists
        if: steps.reuse.outputs.reused != 'true'
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep 'set(PROJECT_VER' idf_app/CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building firmware version: $VERSION"

      - name: Inject version into CMakeLists.txt
        if: steps.reuse.outputs.reused != 'true'
        run: |
          sed -i 's/set(PROJECT_VER ".*")/set(PROJECT_VER "${{ steps.version.outputs.version }}")/' idf_app/CMakeLists.txt
          grep PROJECT_VER idf_app/CMakeLists.txt

      # Do not cache build/: it contains generated sdkconfig, CMake state, and
      # firmware that must be regenerated for the checked-out SHA. The IDF image
      # enables ccache; restoring it by prefix lets source
      # changes reuse prior object compilation while a distinct SHA key saves the
      # updated cache after each successful build.
      - name: Restore ESP-IDF compiler cache
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/cache@v5
        with:
          path: .ci/ccache
          key: ${{ runner.os }}-esp-idf-v5.5.5-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-esp-idf-v5.5.5-ccache-

      - name: Restore Dial managed components
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/cache@v5
        with:
          path: idf_app/managed_components
          key: ${{ runner.os }}-esp-idf-v5.5.5-dial-components-${{ hashFiles('idf_app/dependencies.lock') }}

      - name: Build with ESP-IDF
        if: steps.reuse.outputs.reused != 'true'
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: idf_app
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ci/ccache
            -e CCACHE_MAXSIZE=500M
            -e CCACHE_COMPRESS=1
          command: >-
            set -e;
            ccache --zero-stats;
            idf.py build;
            grep -Fx "CONFIG_COMPILER_OPTIMIZATION_PERF=y" sdkconfig;
            grep -Fx "CONFIG_PM_DFS_INIT_AUTO=y" sdkconfig;
            ! grep -Fx "CONFIG_COMPILER_OPTIMIZATION_DEBUG=y" sdkconfig;
            grep -Fx "CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192" sdkconfig;
            grep -Fx "CONFIG_ESP_SYSTEM_EVENT_TASK_STACK_SIZE=4096" sdkconfig;
            grep -Fx "CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM=y" sdkconfig;
            grep -Fx "CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=49152" sdkconfig;
            grep -Fx "CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=y" sdkconfig;
            grep -Fx "CONFIG_LV_MEM_SIZE_KILOBYTES=24" sdkconfig;
            grep -Fx "CONFIG_LV_MEM_POOL_EXPAND_SIZE_KILOBYTES=72" sdkconfig;
            grep -Fx "CONFIG_RK_BLE_HID_HOST=y" sdkconfig;
            grep -Fx "CONFIG_BT_ENABLED=y" sdkconfig;
            grep -Fx "CONFIG_BT_NIMBLE_ENABLED=y" sdkconfig;
            grep -Fx "CONFIG_BT_NIMBLE_NVS_PERSIST=y" sdkconfig;
            grep -Fx "CONFIG_BT_NIMBLE_SM_SC=y" sdkconfig;
            grep -Fx "CONFIG_BT_NIMBLE_HID_SERVICE=y" sdkconfig;
            python3 ../scripts/audit_firmware_stack.py build/hiphi_dial.elf --output build/stack-audit.json --enforce-dial;
            grep -Fx "CONFIG_BT_NIMBLE_GATT_MAX_PROCS=2" sdkconfig;
            grep -F "/components/esp_hid/" build/compile_commands.json;
            grep -F "/generated/nimble_hidh.c" build/compile_commands.json;
            grep -F "/rk_ble_hid_host.c.obj" build/compile_commands.json;
            ! grep -F "rk_ble_hid_host_stub.c.obj" build/compile_commands.json;
            grep -E "^rk_ble_hid_host_init[[:space:]]+esp-idf/rk_ble_hid_host/librk_ble_hid_host[.]a[(]rk_ble_hid_host[.]c[.]obj[)][[:space:]]*$" build/hiphi_dial.map;
            ! grep -F "rk_ble_hid_host_stub" build/hiphi_dial.map;
            esptool.py --chip esp32s3 merge_bin
            -o ../hiphi_dial_merged.bin
            --flash_mode dio --flash_freq 80m --flash_size 16MB
            0x0 build/bootloader/bootloader.bin
            0x8000 build/partition_table/partition-table.bin
            0xd000 build/ota_data_initial.bin
            0x10000 build/hiphi_dial.bin;
            ccache --show-stats


      - name: Verify merged Dial flash image
        if: steps.reuse.outputs.reused != 'true'
        run: |
          ls -la idf_app/build/hiphi_dial.bin hiphi_dial_merged.bin

      - name: Package verified firmware with provenance
        if: steps.reuse.outputs.reused != 'true'
        env:
          FIRMWARE_FILES: |
            idf_app/build/stack-audit.json
            idf_app/build/hiphi_dial.bin
            idf_app/build/bootloader/bootloader.bin
            idf_app/build/partition_table/partition-table.bin
            idf_app/build/ota_data_initial.bin
            hiphi_dial_merged.bin
        run: python3 scripts/firmware_artifact_cache.py stage --target dial --directory firmware-cache/dial

      - name: Save exact firmware artifact
        if: github.event_name == 'pull_request' && steps.reuse.outputs.reused != 'true'
        uses: actions/cache/save@v5
        with:
          path: firmware-cache/dial
          key: firmware-v1-dial-${{ steps.firmware-key.outputs.fingerprint }}

      - name: Upload HiPhi Dial artifact
        uses: actions/upload-artifact@v6
        with:
          name: hiphi-dial-firmware
          path: firmware-cache/dial/
          retention-days: 30

  build-knob-aux:
    name: build-waveshare-knob-aux-parking-image
    needs: test-shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fingerprint firmware inputs
        id: firmware-key
        run: python3 scripts/firmware_artifact_cache.py key --target aux --directory firmware-cache/aux

      - name: Restore exact firmware artifact
        id: firmware-cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: firmware-cache/aux
          key: firmware-v1-aux-${{ steps.firmware-key.outputs.fingerprint }}

      - name: Verify reusable firmware
        id: reuse
        if: steps.firmware-cache.outputs.cache-hit == 'true'
        run: |
          if python3 scripts/firmware_artifact_cache.py verify --target aux --directory firmware-cache/aux; then
            echo 'reused=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Get firmware version
        if: steps.reuse.outputs.reused != 'true'
        id: knob-aux-version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF#refs/tags/v}; else VERSION=$(grep 'set(PROJECT_VER' knob_aux_app/CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/'); fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Inject version into auxiliary CMakeLists.txt
        if: steps.reuse.outputs.reused != 'true'
        run: sed -i 's/set(PROJECT_VER ".*")/set(PROJECT_VER "${{ steps.knob-aux-version.outputs.version }}")/' knob_aux_app/CMakeLists.txt

      - name: Restore auxiliary compiler cache
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/cache@v5
        with:
          path: .ci/ccache-knob-aux
          key: ${{ runner.os }}-esp-idf-v5.5.5-knob-aux-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-esp-idf-v5.5.5-knob-aux-ccache-

      - name: Build auxiliary ESP32 parking firmware
        if: steps.reuse.outputs.reused != 'true'
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32
          path: knob_aux_app
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ci/ccache-knob-aux
            -e CCACHE_MAXSIZE=500M
            -e CCACHE_COMPRESS=1
          command: >-
            set -e;
            ccache --zero-stats;
            idf.py build;
            python3 ../scripts/audit_firmware_stack.py build/hiphi_knob_aux_park.elf --output build/stack-audit.json;
            grep -Fx "CONFIG_COMPILER_OPTIMIZATION_PERF=y" sdkconfig;
            grep -Fx "CONFIG_IDF_TARGET_ESP32=y" sdkconfig;
            grep -Fx "CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y" sdkconfig;
            grep -Fx "CONFIG_BOOTLOADER_LOG_LEVEL_NONE=y" sdkconfig;
            grep -Fx "CONFIG_LOG_DEFAULT_LEVEL_NONE=y" sdkconfig;
            grep -F "esp_sleep_disable_wakeup_source(ESP_SLEEP_WAKEUP_ALL)" main/main.c;
            grep -F "ESP_PD_DOMAIN_RTC_PERIPH, ESP_PD_OPTION_OFF" main/main.c;
            grep -F "ESP_PD_DOMAIN_RTC_SLOW_MEM, ESP_PD_OPTION_OFF" main/main.c;
            grep -F "ESP_PD_DOMAIN_RTC_FAST_MEM, ESP_PD_OPTION_OFF" main/main.c;
            ! grep -E "vTaskDelay|esp_wifi|esp_bt|nimble" main/main.c;
            esptool.py --chip esp32 merge_bin
            -o ../hiphi_knob_aux_park_merged.bin
            --flash_mode dio --flash_freq 40m --flash_size 4MB
            0x1000 build/bootloader/bootloader.bin
            0x8000 build/partition_table/partition-table.bin
            0x10000 build/hiphi_knob_aux_park.bin;
            esptool.py --chip esp32 image_info build/hiphi_knob_aux_park.bin;
            ccache --show-stats

      - name: Package verified firmware with provenance
        if: steps.reuse.outputs.reused != 'true'
        env:
          FIRMWARE_FILES: |
            knob_aux_app/build/stack-audit.json
            knob_aux_app/build/hiphi_knob_aux_park.bin
            knob_aux_app/build/bootloader/bootloader.bin
            knob_aux_app/build/partition_table/partition-table.bin
            hiphi_knob_aux_park_merged.bin
        run: python3 scripts/firmware_artifact_cache.py stage --target aux --directory firmware-cache/aux

      - name: Save exact firmware artifact
        if: github.event_name == 'pull_request' && steps.reuse.outputs.reused != 'true'
        uses: actions/cache/save@v5
        with:
          path: firmware-cache/aux
          key: firmware-v1-aux-${{ steps.firmware-key.outputs.fingerprint }}

      - name: Upload auxiliary parking firmware
        uses: actions/upload-artifact@v6
        with:
          name: hiphi-knob-aux-parking-firmware
          path: firmware-cache/aux/
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test-shared, build-idf, build-knob-aux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download HiPhi Dial firmware
        uses: actions/download-artifact@v7
        with:
          name: hiphi-dial-firmware
          path: dial-artifacts

      - name: Download Waveshare auxiliary parking firmware
        uses: actions/download-artifact@v7
        with:
          name: hiphi-knob-aux-parking-firmware
          path: aux-artifacts

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Get release notes from draft
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Try to get draft release body (maintained by release-drafter)
          DRAFT_BODY=$(gh api repos/${{ github.repository }}/releases \
            --jq '.[] | select(.draft == true) | .body' 2>/dev/null | head -1 || echo "")

          # Check if draft has actual PR content (not just empty template)
          if [ -n "$DRAFT_BODY" ] && echo "$DRAFT_BODY" | grep -q "github.com.*pull"; then
            echo "$DRAFT_BODY" > release_notes.md
            echo "Using draft release notes from release-drafter"
          else
            # Fallback: generate notes via GitHub API
            echo "Draft empty or no PRs, generating from GitHub API..."
            # Get previous tag via GitHub API (more reliable than git in shallow clones)
            PREV_TAG=$(gh api repos/${{ github.repository }}/tags --jq '.[].name' | grep '^v' | sort -V | grep -B1 "^${{ github.ref_name }}$" | head -1)
            if [ "$PREV_TAG" = "${{ github.ref_name }}" ]; then
              # Current tag is oldest, no previous
              PREV_TAG=""
            fi
            echo "Previous tag: $PREV_TAG"
            if [ -n "$PREV_TAG" ]; then
              gh api repos/${{ github.repository }}/releases/generate-notes \
                -f tag_name="${{ github.ref_name }}" \
                -f previous_tag_name="$PREV_TAG" \
                --jq '.body' > release_notes.md 2>/dev/null || echo "## What's Changed" > release_notes.md
            else
              echo "## What's Changed" > release_notes.md
            fi
            echo "Generated release notes"
          fi
          echo "--- Release notes content ---"
          cat release_notes.md

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp dial-artifacts/idf_app/build/hiphi_dial.bin release-assets/
          cp dial-artifacts/idf_app/build/hiphi_dial.bin release-assets/roon_knob.bin
          cp dial-artifacts/idf_app/build/bootloader/bootloader.bin \
            release-assets/hiphi_dial_bootloader.bin
          cp dial-artifacts/idf_app/build/partition_table/partition-table.bin \
            release-assets/hiphi_dial_partition-table.bin
          cp dial-artifacts/idf_app/build/ota_data_initial.bin \
            release-assets/hiphi_dial_ota_data_initial.bin
          cp dial-artifacts/hiphi_dial_merged.bin release-assets/
          cp dial-artifacts/hiphi_dial_merged.bin release-assets/roon_knob_merged.bin
          cmp release-assets/hiphi_dial.bin release-assets/roon_knob.bin
          cmp release-assets/hiphi_dial_merged.bin \
            release-assets/roon_knob_merged.bin

          cp aux-artifacts/knob_aux_app/build/hiphi_knob_aux_park.bin \
            release-assets/
          cp aux-artifacts/knob_aux_app/build/bootloader/bootloader.bin \
            release-assets/hiphi_knob_aux_park_bootloader.bin
          cp aux-artifacts/knob_aux_app/build/partition_table/partition-table.bin \
            release-assets/hiphi_knob_aux_park_partition-table.bin
          cp aux-artifacts/hiphi_knob_aux_park_merged.bin release-assets/

          (cd release-assets && sha256sum *.bin > SHA256SUMS.txt)
          ls -la release-assets/

      - name: Build release body
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Lead with the useful, curated notes. Keep the generated PR list as
          # reference material at the end instead of making readers dig through
          # it before learning what the release does.
          sed "s/{{VERSION}}/$VERSION/g; s#{{REPOSITORY}}#${GITHUB_REPOSITORY}#g" .github/RELEASE_TEMPLATE.md > final_body.md
          printf '\n---\n\n## Complete changelog\n\n' >> final_body.md
          cat release_notes.md >> final_body.md

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_EXISTS=$(gh release view "${{ github.ref_name }}" --json assets --jq '.assets | length' 2>/dev/null || echo "0")
          echo "existing_assets=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_EXISTS" -gt "0" ]; then
            echo "Release already exists with $RELEASE_EXISTS assets, will only upload missing files"
          fi

      - name: Create or Update Release
        if: steps.check_release.outputs.existing_assets == '0'
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: release-assets/*
          body_path: final_body.md

      - name: Upload assets to existing release
        if: steps.check_release.outputs.existing_assets != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upload any missing assets
          for file in release-assets/*; do
            filename=$(basename "$file")
            if ! gh release view ${{ github.ref_name }} --json assets --jq ".assets[].name" | grep -q "^${filename}$"; then
              echo "Uploading $filename..."
              gh release upload ${{ github.ref_name }} "$file" --clobber
            else
              echo "$filename already exists, skipping"
            fi
          done

      - name: Verify prereleases cannot become stable OTA
        if: ${{ contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.prerelease')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" != "${GITHUB_REF_NAME}"

  # NOTE: Docker builds moved to unified-hifi-control repo
  # The muness/unified-hifi-control and muness/roon-extension-knob images
  # are now built from https://github.com/open-horizon-labs/unified-hifi-control
